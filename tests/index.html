<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>單元測試 — 補習班排程系統</title>
<style>
  body { font-family: -apple-system, system-ui, 'Noto Sans TC', sans-serif; max-width: 900px; margin: 20px auto; padding: 0 20px; color: #222; line-height: 1.5; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  h2 { font-size: 14px; margin: 20px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #ddd; color: #555; }
  .summary { padding: 10px 14px; background: #f0f0f0; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
  .summary.all-pass { background: #d4edda; color: #155724; }
  .summary.has-fail { background: #f8d7da; color: #721c24; }
  .case { padding: 3px 10px; font-size: 13px; border-radius: 3px; margin: 2px 0; font-family: 'Menlo', 'Monaco', monospace; }
  .pass { color: #28a745; }
  .fail { color: #dc3545; background: #fff5f5; padding: 6px 10px; }
  pre { margin: 6px 0 0 22px; padding: 8px 10px; background: #f5f5f5; border-radius: 3px; font-size: 11px; overflow-x: auto; white-space: pre-wrap; color: #333; }
  .hint { color: #888; font-size: 12px; margin-bottom: 12px; }
</style>
</head>
<body>

<h1>單元測試（enrollment.js + schedule.js + absence.js + students.js）</h1>
<div class="hint">改 <code>js/enrollment.js</code>、<code>js/schedule.js</code>、<code>js/absence.js</code> 或 <code>js/students.js</code> 後，重新整理本頁即可看到所有測試結果。失敗的會用紅底顯示預期與實際差異。</div>

<div id="results"></div>

<!-- 0a. 學期／門檻 helpers 的真身（absence.js 的次數提醒要用 getPeriods/periodOfDate/getThreshold）。
     必須排在 stub 前面：下面那塊的 var driveData = {...} 會把這裡的初值蓋掉，順序反了就沒 stub 資料。 -->
<script src="../js/state.js"></script>

<!-- 0a2. 逐筆合併的純函式（多裝置同步 第二刀）。不碰 DOM 也不碰 Firebase，直接載真身 -->
<script src="../js/sync.js"></script>

<!-- 0b. enrollment.js 依賴的全域 stub（測試固定在 2025 學年下學期） -->
<script>
var driveData = { studentList: [], makeupScheduled: [], enrollments: [], coursePrices: [] };
var currentPeriodId = 'sem2';
var _saveCount = 0;
function getSchoolYear() { return 2025; }
function detectPeriodId() { return 'sem2'; }
function getStudentList() { return driveData.studentList || []; }
function scheduleDriveSave() { _saveCount++; }
function refreshCourseCards() {}   // 真身在 week.js（純重繪，測試不需要）
// schedule.js 的 sysAbsenceEvents 會反查系統課程（courses.js 提供，這裡照原樣 stub）
function getCourses() { return driveData.courses || []; }
function findCourseById(id) { return getCourses().find(c => c.id === id); }
// dayview.js 拖曳寫入時會用到的其他全域（真身在 courses.js / makeup.js / init.js，
// 那幾支綁 DOM 太深，這裡只補會被呼叫到的部分）
var currentDate = new Date();
var WD = ['日', '一', '二', '三', '四', '五', '六'];   // 真身在 state.js（上面已載入，這裡重寫一次無妨）
var makeupMatchMap = new Map();
var _mkCalls = [];              // 記錄 saveMakeupScheduled 被怎麼呼叫，供斷言
function saveCourses(list) { driveData.courses = list; _saveCount++; }
// courses.js 之後會用真身蓋掉 courseNameOn / courseTeacherNames / getCourses / findCourseById
// （滾動命名要測真的），這兩支是它們的下游，courses.js 沒有、留在這裡
function studentName(id) { const s = getStudentList().find(x => x.id === id); return s ? s.name : '(已刪除)'; }
function teacherNameById() { return '王老師'; }
function courseNameOn(co) { return co.name; }
function courseTeacherNames() { return ['王老師']; }
function isSignedIn() { return true; }
// 動態紀錄（真身在 activity.js，要 Firebase 才跑得動）：這裡收起來就好，測的是資料寫入不是記錄
var _actCalls = [];
function logAct(kind, text, target, detail) { _actCalls.push({ kind, text, target, detail }); }
function actEvLabel(ev) { return ev && ev.origTitle || ''; }
// 顯示署名。真身（activity.js）會拿信箱去查 STAFF_NAMES 對照表，這裡照同一條規則收斂：
// 有信箱就用信箱前綴、沒有就退回紀錄裡抄的名字。少了這兩支，待補課留言串的測試會噴
// 「actWho is not defined」（2026-08-27 修：那 4 條紅就是這樣來的）。
function actName(email) { return String(email || '').split('@')[0] || '某人'; }
function actWho(by, snapName) { return by ? actName(by) : (String(snapName || '').trim() || '某人'); }
function getMakeupScheduledLS() { return driveData.makeupScheduled || []; }
</script>

<!-- 1. 被測程式（utils.js 提供 toDateStr/fmtT，dayview.js 的拖曳寫入需要）-->
<!-- undo.js 要排在 makeup.js 前面：deleteMakeupScheduled 等寫入函式會呼叫 undoBegin/undoOffer。
     它只碰 driveData 與 #undo-bar（測試頁沒有那顆 DOM → undoOffer 自己就退出了），不影響任何斷言。 -->
<script src="../js/undo.js"></script>
<script src="../js/utils.js"></script>
<!-- 共用月曆／時間面板：makeup.js 的日期列會用 dpParse／dpOpenAt，
     courses.js 與 makeup.js 的時段欄位會用 tpForInput -->
<script src="../js/datepicker.js"></script>
<script src="../js/timepicker.js"></script>
<script src="../js/enrollment.js"></script>
<script src="../js/schedule.js"></script>
<script src="../js/dayview.js"></script>
<script src="../js/courses.js"></script>
<script src="../js/absence.js"></script>
<script src="../js/makeup.js"></script>
<script src="../js/students.js"></script>
<!-- settings.js＝課程管理頁（期別交接卡 coCarry* 在裡面）。頂層只有宣告、不碰 DOM，
     它的 studentName 與上面那顆 stub 行為等價（都是查 driveData.studentList），覆蓋掉沒差 -->
<script src="../js/settings.js"></script>
<script src="../js/newterm.js"></script>
<script src="../js/search.js"></script>
<script src="../js/remind.js"></script>

<!-- 1b. 測試用包裝：saveMakeupScheduled 走 makeup.js 的真身（要驗真的寫進 makeupScheduled
     的形狀），外面再包一層記錄呼叫的 spy（dayview-move 的斷言靠 _mkCalls）。
     真身必須先被抓進另一個 <script>——同一塊裡 function 宣告會被提升，會抓到自己變成無限遞迴。 -->
<script>var _realSaveMakeup = saveMakeupScheduled;</script>
<script>
// ⚠ 參數要跟真身一模一樣地轉手（含最後的 teacher，以及「沒傳」和「傳 null」的差別：
//    沒傳＝沿用原本存的老師，傳 null＝改回原班老師）
function saveMakeupScheduled(ev, sS, sE, room, calEventId, calName, students, recId, teacher) {
  _mkCalls.push({ id: ev.id, students: (students || ev.absentStudents || []).slice(),
    start: sS, end: sE, room, calName, teacher });
  return arguments.length >= 9
    ? _realSaveMakeup(ev, sS, sE, room, calEventId, calName, students, recId, teacher)
    : _realSaveMakeup(ev, sS, sE, room, calEventId, calName, students, recId);
}
// 重畫類的下游（真身要 DOM／Firebase）：測的是資料寫入，畫面收掉就好
function renderMakeup() {}
function updateMakeupBadge() { return 0; }
function loadToday() { return Promise.resolve(); }
function loadWeek() { return Promise.resolve(); }
function toast() {}
</script>

<!-- 2. 測試框架（會註冊 DOM 載入後自動跑） -->
<script src="test-runner.js"></script>

<!-- 3. 各個測試檔（每個檔註冊自己的 suite） -->
<script src="enrollment.test.js"></script>
<script src="dayview-move.test.js"></script>
<script src="dayview-prac-roster.test.js"></script>
<script src="course-type.test.js"></script>
<script src="teacher-phase.test.js"></script>
<script src="leave-threshold.test.js"></script>
<script src="student-stats.test.js"></script>
<script src="makeup-split.test.js"></script>
<script src="makeup-join.test.js"></script>
<script src="makeup-join-host.test.js"></script>
<script src="makeup-custom.test.js"></script>
<script src="makeup-owed-freeze.test.js"></script>
<script src="makeup-student-busy.test.js"></script>
<script src="makeup-teacher.test.js"></script>
<script src="makeup-notes.test.js"></script>
<script src="makeup-occ-card.test.js"></script>
<script src="makeup-period.test.js"></script>
<script src="makeup-day-avail.test.js"></script>
<script src="absence-mixed.test.js"></script>
<script src="practice-no-makeup.test.js"></script>
<script src="student-leaves.test.js"></script>
<script src="search.test.js"></script>
<script src="teacher-schedule.test.js"></script>
<script src="sync-merge.test.js"></script>
<script src="sync-queue.test.js"></script>
<script src="undo.test.js"></script>
<script src="period-carry.test.js"></script>
<script src="newterm.test.js"></script>
<!-- remind 放最後：它把 currentPeriodId 切成 summer 且不還原，排前面會影響後面的測試 -->
<script src="remind.test.js"></script>

</body>
</html>
